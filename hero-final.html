<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stud Von Axe · Hero</title>

<!--
  ============================================================
  STUD VON AXE · FINAL HERO
  Chosen: T2 Centred + Portrait overlay cards.
  This is the canonical hero. It gets folded into direction A, B
  and C, which keep their own typefaces and section styling but
  share this header and hero exactly.

  DECISIONS BAKED IN, do not undo casually:

  1. Cards are true 3/4 portrait at every size. Two earlier
     attempts tied card height to viewport height and flattened
     them into landscape boxes, which lost the whole look.

  2. Four cards across on desktop. The row runs past the fold on
     purpose, signed off, it reads as an invitation to scroll.

  3. Card is photography only at rest. Name, category, year and
     status fade in on hover, over a gradient that also fades in.

  4. The reveal is scoped to (hover:hover) and (pointer:fine).
     On touch the text and gradient are ALWAYS visible. There is
     no hover on a phone and most of this audience is on a phone
     at a show. Do not remove this media query.

  5. Cards are links, so the reveal also fires on keyboard focus
     with a visible focus ring.

  6. Headline is full size. An earlier build capped it to force
     everything above the fold and it read as a downgrade.

  LOGO: the wordmark here is a typographic placeholder. The real
  mark is a horse skull facing forward with a crown, built to sit
  centred, which is why the header centres it. Swap in the vector
  (light version here, reversed for navy bands) when it arrives.

  COLOUR: every colour is a variable. The gold Pantone is still
  coming from the client, change --gold once.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Jost:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  /* brand */
  --navy:#0f1d2e;
  --navy-deep:#0a1522;
  --gold:#b28a4d;          /* <-- client Pantone swaps in here */
  --gold-soft:#cdae7c;
  --base:#faf8f4;

  /* type */
  --serif:"Libre Caslon Display",Georgia,serif;
  --sans:"Jost","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;

  /* one spacing scale, so the vertical rhythm is deliberate
     rather than a pile of one off margins */
  --s1:6px;
  --s2:11px;
  --s3:18px;
  --s4:26px;
  --s5:clamp(30px,5vh,52px);
  --gutter:clamp(20px,4vw,52px);

  /* The air around the centred statement. Applied ONCE above and ONCE
     below so the two are equal: the hero body owns both, and the card
     reel adds none of its own. Stacking body padding and reel padding
     previously gave 54px above and 108px below, which read as the type
     sitting too high. Signed off that the card row may sit lower and
     run further past the fold to pay for this. */
  --hero-air:clamp(60px,10.5vh,132px);

  --card-gap:14px;
  --r-card:20px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--navy-deep);color:var(--base);
  font-family:var(--body);font-size:17px;line-height:1.6;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
h1{margin:0;font-weight:400}

/* =========================================================
   HERO
   ========================================================= */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;background:var(--navy-deep)}

.hero__bg{position:absolute;inset:0}
.hero__bg img{width:100%;height:100%;object-fit:cover;object-position:center 32%}
.hero__bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,
    rgba(8,16,26,.62) 0%,
    rgba(8,16,26,.10) 28%,
    rgba(8,16,26,.42) 60%,
    rgba(8,16,26,.95) 100%);
}

/* ---- header ---- */
.hd{position:relative;z-index:20;padding:var(--s4) var(--gutter) 0}
.hd__row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--s3)}
.hd nav{display:flex;gap:clamp(15px,2.1vw,32px);flex-wrap:wrap}
.hd nav a{
  font-family:var(--sans);font-size:13px;letter-spacing:.07em;
  color:rgba(255,255,255,.8);padding-bottom:3px;
  border-bottom:1px solid transparent;transition:color .4s var(--ease),border-color .4s var(--ease);
}
.hd nav a:hover,.hd nav a[aria-current="page"]{color:#fff;border-bottom-color:var(--gold)}
.hd__end{display:flex;justify-content:flex-end;align-items:center;gap:var(--s3)}
.lang{font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;color:rgba(255,255,255,.6);white-space:nowrap}
.lang b{color:#fff;font-weight:400}
.lang span{opacity:.5;margin:0 4px}
.pill{
  font-family:var(--sans);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid rgba(255,255,255,.48);color:#fff;
  padding:10px 22px;border-radius:100px;white-space:nowrap;
  transition:background .4s var(--ease),color .4s var(--ease),border-color .4s var(--ease);
}
.pill:hover{background:#fff;color:var(--navy);border-color:#fff}
.hd__rule{position:relative;z-index:20;height:1px;background:rgba(255,255,255,.24);margin:var(--s3) var(--gutter) 0}

/* wordmark placeholder, centred because the real mark is a centred emblem */
.mark{display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1;color:#fff}
.mark__crown{color:var(--gold);font-size:15px}
.mark__wm{font-family:var(--serif);font-size:19px;letter-spacing:.16em;white-space:nowrap}
.mark__wm i{color:var(--gold);font-style:normal;margin:0 .35em}
.mark__tag{font-family:var(--sans);font-size:7.5px;letter-spacing:.3em;text-transform:uppercase;opacity:.7;white-space:nowrap}

/* ---- centred statement ---- */
.hero__body{
  position:relative;z-index:20;flex:1;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:var(--hero-air) var(--gutter);
}
.eyebrow{
  font-family:var(--sans);font-size:11px;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(255,255,255,.7);margin:0 0 clamp(16px,2.2vh,26px);
}
.hero h1{
  font-family:var(--serif);color:#fff;text-transform:uppercase;
  font-size:clamp(2.4rem,7.4vw,6.4rem);line-height:.9;letter-spacing:-.012em;
  max-width:20ch;text-wrap:balance;
}
.hero__lede{
  color:rgba(255,255,255,.87);font-size:16.5px;
  max-width:52ch;margin:clamp(22px,3vh,34px) auto 0;
}
.hero__ctas{
  display:flex;gap:var(--s2);flex-wrap:wrap;justify-content:center;
  margin-top:clamp(26px,3.6vh,40px);
}
.btn{
  font-family:var(--sans);font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:14px 28px;border-radius:100px;white-space:nowrap;
  transition:background .4s var(--ease),color .4s var(--ease),border-color .4s var(--ease);
}
.btn--gold{background:var(--gold);color:var(--navy)}
.btn--gold:hover{background:#fff}
.btn--ghost{color:#fff;border:1px solid rgba(255,255,255,.45)}
.btn--ghost:hover{border-color:#fff;background:rgba(255,255,255,.09)}

/* =========================================================
   MARQUEE
   ========================================================= */
/* no padding-top here on purpose, the hero body already owns the gap
   above the cards, see --hero-air */
.reel{position:relative;z-index:20;padding-bottom:var(--s4)}
.reel__vp{
  position:relative;overflow:hidden;width:100%;
  /* soften the edges so cards leaving the frame look intentional
     instead of chopped off by the viewport */
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 64px,#000 calc(100% - 64px),transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 64px,#000 calc(100% - 64px),transparent 100%);
}
.reel__track{
  display:flex;gap:var(--card-gap);width:max-content;
  padding:0 var(--gutter);
  animation:reel 64s linear infinite;
}
.reel__vp:hover .reel__track,
.reel__vp:focus-within .reel__track{animation-play-state:paused}
@keyframes reel{to{transform:translateX(-50%)}}

/* ---- card ---- */
.card{
  position:relative;display:block;flex:0 0 auto;
  /* four across on desktop, never smaller than legible on a phone */
  width:clamp(248px,calc((100vw - (2 * var(--gutter)) - (3 * var(--card-gap))) / 4),420px);
  aspect-ratio:3/4;                 /* true portrait, at every size */
  border-radius:var(--r-card);overflow:hidden;
  background:#0d1622;border:1px solid rgba(255,255,255,.09);
}
.card img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform 1.1s var(--ease);
}
.card::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 34%,rgba(6,12,20,.52) 64%,rgba(6,12,20,.92) 100%);
}
.card__body{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:var(--s3) clamp(16px,1.6vw,22px) var(--s3);
}
.card__nm{
  font-family:var(--serif);font-size:clamp(17px,1.5vw,21px);line-height:1.25;
  display:block;color:#fff;margin-bottom:var(--s1);
}
.card__meta{
  font-family:var(--sans);font-size:10px;letter-spacing:.17em;text-transform:uppercase;
  color:rgba(255,255,255,.76);
}
.card__st{font-style:normal}
.card__st--sold{color:var(--gold-soft)}
.dot{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--gold);vertical-align:middle;margin:0 7px 2px}

/* Reveal on hover, pointer devices only.
   On touch the text and gradient stay visible, see note 4 up top. */
@media (hover:hover) and (pointer:fine){
  .card__body{
    opacity:0;transform:translateY(10px);
    transition:opacity .55s var(--ease),transform .55s var(--ease);
  }
  .card::after{opacity:0;transition:opacity .55s var(--ease)}
  .card:hover .card__body,
  .card:focus-visible .card__body{opacity:1;transform:none}
  .card:hover::after,
  .card:focus-visible::after{opacity:1}
  .card:hover img{transform:scale(1.04)}
  .card:focus-visible{outline:1px solid var(--gold-soft);outline-offset:3px}
}

@media (prefers-reduced-motion:reduce){
  .reel__track{animation:none}
  .reel__vp{overflow-x:auto}
  .card img{transition:none}
  .card:hover img{transform:none}
}

/* Short screens.
   This block used to collapse the spacing around the statement to force
   the card row above the fold. On a laptop under 820px tall that made
   the type look wedged between the header and the cards, which was the
   whole complaint. The spacing is now left alone and the cards are
   simply allowed to sit lower. All that remains here is a floor on the
   air, so the block never gets tighter than this. */
@media (max-height:820px){
  /* --hero-air already floors at 44px, so the spacing needs no override
     here. Only the lede steps down a touch. */
  .hero__lede{font-size:16px}
  .reel{padding-bottom:var(--s3)}
}

@media (max-width:860px){
  .hd nav,.lang{display:none}
  .hd__row{grid-template-columns:1fr auto}
  .reel__vp{
    -webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 40px),transparent 100%);
    mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 40px),transparent 100%);
  }
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero__bg">
    <img src="https://www.studvonaxe.it/wp-content/uploads/2023/10/image-header-va.jpg"
         alt="A Stud Von Axe sport horse at the stable" loading="eager">
  </div>

  <header class="hd">
    <div class="hd__row">
      <nav aria-label="Main">
        <a href="#" aria-current="page">Home</a>
        <a href="#">Horses</a>
        <a href="#">Embryos</a>
        <a href="#">Semen</a>
        <a href="#">News</a>
      </nav>

      <a class="mark" href="#" aria-label="Stud Von Axe, home">
        <span class="mark__crown" aria-hidden="true">&#9819;</span>
        <span class="mark__wm">VON<i>|</i>AXE</span>
        <span class="mark__tag">Breeding and horse trading</span>
      </a>

      <div class="hd__end">
        <p class="lang"><b>EN</b><span>/</span>IT</p>
        <a href="#contact" class="pill">Contact us</a>
      </div>
    </div>
  </header>
  <div class="hd__rule"></div>

  <div class="hero__body">
    <p class="eyebrow">Desenzano del Garda &middot; Lanaken</p>
    <h1>Bred for the biggest arenas</h1>
    <p class="hero__lede">Foals, embryos and frozen semen, raised between our Italian and Belgian bases and sold to breeders in ten countries.</p>
    <div class="hero__ctas">
      <a href="#horses" class="btn btn--gold">View the horses</a>
      <a href="#contact" class="btn btn--ghost">Ask about a horse</a>
    </div>
  </div>

  <div class="reel">
    <div class="reel__vp">
      <div class="reel__track" id="reel"></div>
    </div>
  </div>
</section>

<script>
/* Real horses from studvonaxe.it.
   Only the four whose listing photographs actually show the named
   horse. Hayley VD Berghoeve Z and the Mosito x Carma embryo are
   excluded on purpose: on the client's own site those two listings
   use photos of Ganesh Hero Z and Elvis Ter Putte. At this card size
   that would be impossible to miss. Put them back once the client
   supplies correct images. */
const HORSES=[
  {name:"Arkhana Von Axe Z",     cat:"Foal, colt",  year:"2026", status:"Available", sold:false,
   img:"https://www.studvonaxe.it/wp-content/uploads/2026/04/e2c30f92-7f9a-47d7-b9a4-fb5919abf104-400x300.jpg"},
  {name:"Cortina de Jolie Z",    cat:"Broodmare",   year:"2019", status:"Available", sold:false,
   img:"https://www.studvonaxe.it/wp-content/uploads/2024/04/NB2_4850-scaled-400x300.jpg"},
  {name:"Charina Von Axe Z",     cat:"Foal, filly", year:"2026", status:"Sold, GB",  sold:true,
   img:"https://www.studvonaxe.it/wp-content/uploads/2025/07/IMG_2051-400x300.jpg"},
  {name:"Unguessable Von Axe",   cat:"Broodmare",   year:"2018", status:"Sold, US",  sold:true,
   img:"https://www.studvonaxe.it/wp-content/uploads/2022/05/unguessable-12-scaled-e1739207394932-400x300.jpg"}
];

function card(h,dup){
  /* Duplicates exist only so the marquee can loop seamlessly, so they
     are hidden from screen readers and removed from the tab order. */
  const a = dup ? ' aria-hidden="true" tabindex="-1"' : ` aria-label="${h.name}. ${h.cat}, ${h.year}. ${h.status}."`;
  return `<a class="card" href="#"${a}>
    <img src="${h.img}" alt="${dup?'':h.name}" loading="lazy">
    <div class="card__body">
      <span class="card__nm">${h.name}</span>
      <span class="card__meta">${h.cat}<i class="dot"></i>${h.year}<i class="dot"></i><em class="card__st${h.sold?' card__st--sold':''}">${h.status}</em></span>
    </div>
  </a>`;
}

document.getElementById('reel').innerHTML =
  HORSES.map(h=>card(h,false)).join('') + HORSES.map(h=>card(h,true)).join('');
</script>
</body>
</html>
